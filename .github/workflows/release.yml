name: Release

# Maintenance notes:
# - The release body below is written per-release; update it before tagging
#   a new version (it is the canonical release-notes draft).
# - Asset naming caveat: DMG names derive from tauri.conf.json productName
#   ("Bilingual AI Teleprompter"); GitHub replaces spaces with dots in
#   uploaded asset filenames (Bilingual.AI.Teleprompter_x.y.z_arch.dmg).
#   Do NOT rename the product to "fix" this — the app is published under
#   this name. If predictable asset names ever matter, rename the files in
#   a build step before upload instead.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }} — Bilingual AI Teleprompter
          draft: true
          prerelease: false
          body: |
            ## Bilingual AI Teleprompter v1.0.0

            First release of this fork of [openTeleprompt](https://github.com/ArunNGun/openTeleprompt) by [ArunNGun](https://github.com/ArunNGun) (MIT). All the upstream v3.0.0 goodness — the Dynamic Island notch overlay, voice-activated scrolling, rich-text script editor, script library, screen-share invisibility — plus two new headline features.

            ---

            ### 🗣️ Word-level speech tracking (English + 中文)

            Instead of scrolling at a fixed speed whenever it hears sound, the prompter now recognizes **what** you say — fully on-device via Apple's Speech framework — and follows your reading position word by word:

            - Spoken text dims, your current word is highlighted, and the scroll is driven by where you actually are in the script.
            - English and Mandarin, selectable in settings. Chinese is tracked per character (no spaces needed); mixed Chinese-English scripts work.
            - Tolerates skipped words, fillers, and misreads — the cursor never jumps backward.
            - 100% on-device: no audio or transcripts ever leave your Mac. Falls back to the classic frequency-based activation if Speech permission is denied or the language model isn't installed.

            ### ✦ Prepare with AI (optional)

            Paste a raw script — email draft, essay, speech, English or Chinese — and one click rewrites it into teleprompter form: short lines for the narrow notch panel, natural spoken phrasing, and `[PAUSE]` / `[SLOW]` / `[BREATHE]` cue markers at the right moments. Chinese lines break at natural prosodic boundaries.

            - Side-by-side review before anything is applied; your original is always kept.
            - Bring your own Anthropic API key (stored in the macOS Keychain) **or** run fully offline against any OpenAI-compatible local server (e.g. Ollama).
            - Completely optional and off by default — nothing is ever sent anywhere automatically.

            ---

            ### 📦 Downloads — macOS only

            | Platform | File | Notes |
            |---|---|---|
            | 🍎 Apple Silicon (M1–M4) | `Bilingual AI Teleprompter_1.0.0_aarch64.dmg` | macOS 13+ |
            | 🍎 Intel Mac | `Bilingual AI Teleprompter_1.0.0_x64.dmg` | macOS 13+ |

            ### ⚠️ First launch

            The app isn't signed with an Apple Developer certificate, so macOS will claim it's "damaged". It isn't — remove the quarantine flag once:

            ```bash
            xattr -cr "/Applications/Bilingual AI Teleprompter.app"
            ```

            On first read, macOS will ask for **Microphone** and **Speech Recognition** permissions — both are used entirely on-device.

            ---

            Free and open source (MIT). Based on openTeleprompt by ArunNGun — see [NOTICE](https://github.com/JackyJiang08/bilingual-ai-teleprompter/blob/main/NOTICE) for provenance.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-mac-arm:
    name: Build macOS (Apple Silicon)
    runs-on: macos-latest
    needs: create-release
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm install

      - name: Build
        run: npx @tauri-apps/cli build --target aarch64-apple-darwin

      - name: Upload DMG
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-mac-intel:
    name: Build macOS (Intel)
    runs-on: macos-latest
    needs: create-release
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm install

      - name: Build
        run: npx @tauri-apps/cli build --target x86_64-apple-darwin

      - name: Upload DMG
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
